<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Daari</title>
  <style>
    /* Big text and big buttons everywhere in Daari -- our users are
       elderly or new to computers, so nothing is small or subtle. */
    body {
      width: 300px;
      margin: 0;
      padding: 18px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #fffdf7;
      color: #2b2b2b;
    }
    h1     { margin: 0 0 2px; font-size: 22px; }
    .sub   { margin: 0 0 16px; font-size: 13px; color: #6b6b6b; }
    button {
      width: 100%;
      padding: 12px;
      margin-bottom: 8px;
      font-size: 16px;
      font-family: inherit;
      border: 0;
      border-radius: 8px;
      background: #1f6f4a;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { background: #9ab5a7; cursor: default; }
    /* The demo button is the main action, so it leads. */
    #startDemo { background: #c25a00; font-size: 17px; font-weight: bold; }
    #startDemo:hover { background: #a54c00; }
    /* The two developer tools are visibly secondary. */
    #debug, #test { background: #4a5a68; font-size: 14px; padding: 10px; }
    #debug:hover, #test:hover { background: #3a4a58; }

    .divider {
      margin: 14px 0 10px;
      border-top: 1px solid #e0dcd0;
      font-size: 11px;
      color: #8a8a8a;
      padding-top: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    #result {
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13.5px;
      line-height: 1.45;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }
    #result.good { display: block; background: #e6f5ec; border: 1px solid #1f6f4a; }
    #result.bad  { display: block; background: #fdecea; border: 1px solid #b3261e; }
    #result.info { display: block; background: #eef4fb; border: 1px solid #1a4f8a; }
    .url { margin-top: 12px; font-size: 11px; color: #8a8a8a; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Daari</h1>
  <p class="sub">Phase 2 &mdash; ring, caption and local verify</p>

  <button id="startDemo">Start demo</button>

  <div class="divider">Developer tools</div>
  <button id="debug">Show what Daari sees</button>
  <button id="test">Test connection</button>

  <div id="result"></div>
  <p class="url" id="url"></p>

  <!-- config.js must load first: popup.js reads the URL from it. -->
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
